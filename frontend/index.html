<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GridNova – A New Era of Connected Energy</title>
<style>
:root{--g:#059669;--gd:#047857;--gl:#ecfdf5;--ink:#0f172a;--mut:#64748b;--bd:#e2e8f0;--bg:#f8fafc;--red:#dc2626;--amb:#b45309}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:2px;z-index:5}
.brand{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;padding:0 8px 4px}.tag{font-size:11px;color:var(--mut);padding:0 8px 14px}
aside a{padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}aside a:hover{background:var(--bg)}aside a.on{background:var(--gl);color:var(--gd);font-weight:600}
main{margin-left:220px}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
header h1{font-size:18px;margin:0;flex:1}.sim{background:#fef3c7;color:var(--amb);font-weight:700;font-size:11px;padding:4px 10px;border-radius:99px;letter-spacing:.04em}
#page{padding:20px 24px;max-width:1200px}.menu{display:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:16px}.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 1px 2px #0f172a0d}.card h3{margin:0 0 10px;font-size:14px}
.m .v{font-size:22px;font-weight:700}.m .l{color:var(--mut);font-size:12px}.m .n{color:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:13px}th{color:var(--mut);font-weight:600;font-size:12px}.sc{overflow-x:auto}
button,select,input{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--ink)}input,select{min-width:0}
button{cursor:pointer}button.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}button.p:hover{background:var(--gd)}button.d{color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.b{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#e2e8f0}.b.verified,.b.completed,.b.open,.b.filled{background:#d1fae5;color:#065f46}.b.pending{background:#fef3c7;color:var(--amb)}.b.rejected,.b.flagged,.b.cancelled{background:#fee2e2;color:#991b1b}
.note{background:var(--gl);border:1px solid #a7f3d0;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}.empty{color:var(--mut);padding:14px;text-align:center}
.bar{display:flex;gap:2px;align-items:end;height:6px}.bg{height:10px;border-radius:4px;margin:2px 0}
dialog{border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:440px;width:92%}dialog::backdrop{background:#0f172a66}
#toast{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;flex-direction:column;gap:6px}#toast div{padding:10px 14px;border-radius:8px;background:#065f46;color:#fff;max-width:340px}#toast .e{background:#991b1b}
@media(max-width:800px){aside{transform:translateX(-100%);transition:.2s}aside.open{transform:none}main{margin-left:0}.menu{display:block}#page{padding:14px}header{padding:10px 14px}}
</style></head><body>
<aside id="nav" aria-label="Main navigation">
 <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#059669"/><circle cx="14" cy="14" r="4" fill="#fff"/><g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M14 10V4M17.5 16l5 3M10.5 16l-5 3"/></g><g fill="#fff"><circle cx="14" cy="4" r="2"/><circle cx="22.5" cy="19" r="2"/><circle cx="5.5" cy="19" r="2"/></g></svg>GridNova</div>
 <div class="tag">A New Era of Connected Energy</div>
 <a href="#/overview">Overview</a><a href="#/market">Energy Marketplace</a><a href="#/energy">My Energy</a><a href="#/transactions">Transactions</a><a href="#/verify">Verification &amp; Impact</a><a href="#/sim">Microgrid Simulator</a><a href="#/settings">Settings</a>
</aside>
<main><header><button class="menu" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button><h1 id="title"></h1><span class="sim">SIMULATION MODE</span>
 <label>Demo role<select id="role" onchange="setS('role',this.value)"><option>buyer</option><option>seller</option><option>reviewer</option></select></label>
 <label>Demo household<select id="hid" onchange="setS('hid',+this.value)"></select></label>
 <a href="#/settings" title="Latest activity" id="bell" style="text-decoration:none">🔔 <span id="cnt">0</span></a></header>
<div id="page" aria-live="polite"></div></main><div id="toast" role="status"></div><dialog id="dlg"></dialog>
<script>
const S=Object.assign({role:'seller',hid:1},JSON.parse(localStorage.gn||'{}'));
const $=id=>document.getElementById(id), kwh=w=>(w/1000).toFixed(2), inr=p=>p==null?'n/a':'₹'+(p/100).toFixed(2), pct=x=>x==null?'not yet measured':(x*100).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=s=>`<span class="b ${s}">${s}</span>`;
function setS(k,v){S[k]=v;localStorage.gn=JSON.stringify(S);render()}
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('toast').append(d);setTimeout(()=>d.remove(),4500)}
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.m||'GET',headers:{'Content-Type':'application/json','X-Demo-Role':S.role},body:o.b?JSON.stringify(o.b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:(j.detail||[]).map(x=>x.msg).join('; ')||'Request failed');return j}
async function act(fn,ok,refresh){try{const r=await fn();toast(ok);await render();return r}catch(e){toast(e.message,1);if(refresh)await render()}}
const M=(l,v,n)=>`<div class="card m"><div class="l">${l}</div><div class="v">${v}</div><div class="n">${n||''}</div></div>`;
const tbl=(h,rows,empty)=>rows.length?`<div class="sc"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`;
const NOTE='<div class="note"><b>Simulation only.</b> Synthetic data and fictional households. No real electricity is traded, no real meters are read, and nothing here is an official renewable-energy certificate or regulatory approval.</div>';
let HH=[];
const cur=()=>HH.find(h=>h.id==S.hid)||HH[0];
const P={
async overview(){const d=await api('/dashboard'),m=d.metrics,mx=Math.max(1,...d.households.map(h=>Math.max(h.generation_wh,h.consumption_wh)));
 return NOTE+`<div class="grid">${M('Total generation',kwh(m.generation_wh)+' kWh','simulated day, all households')}${M('Total consumption',kwh(m.consumption_wh)+' kWh')}${M('Available surplus',kwh(m.surplus_wh)+' kWh','sum of max(0, gen − cons)')}${M('Currently listed',kwh(m.listed_wh)+' kWh','open offers, remaining')}${M('Matched (traded)',kwh(m.traded_wh)+' kWh','completed trades only')}${M('Completed trades',m.trades)}${M('Buyer savings (est.)',inr(m.buyer_savings_paise),'vs ₹'+m.baselines.grid_tariff_inr+'/kWh grid tariff assumption')}${M('Seller earnings (gross)',inr(m.seller_earnings_paise))}${M('Verified generation',kwh(m.verified_wh)+' kWh','app-level verification')}</div>
 <div class="two"><div class="card"><h3>Generation vs consumption (kWh)</h3>${d.households.map(h=>`<div><small>${esc(h.name)}</small><div class="bg" style="width:${h.generation_wh/mx*100}%;background:#059669" title="gen"></div><div class="bg" style="width:${h.consumption_wh/mx*100}%;background:#94a3b8" title="cons"></div><small>${kwh(h.generation_wh)} gen · ${kwh(h.consumption_wh)} cons</small></div>`).join('')}<small>■ green: generation, ■ gray: consumption</small></div>
 <div class="card"><h3>Verification summary</h3>${Object.entries(d.verification).map(([k,v])=>`<p>${badge(k)} ${v} record(s)</p>`).join('')}<small>Verified ${kwh(m.verified_wh)} kWh of ${kwh(m.generation_wh)} kWh generated.</small></div></div>
 <div class="two"><div class="card"><h3>Recent transactions</h3>${tbl(['ID','Qty','Amount','Status'],d.recent_trades.map(t=>`<tr><td>${t.tid}</td><td>${kwh(t.qty_wh)}</td><td>${inr(t.amount_paise)}</td><td>${badge(t.status)}</td></tr>`),'No trades yet.')}</div>
 <div class="card"><h3>Open offers</h3>${tbl(['Seller','Left kWh','₹/kWh'],d.open_offers.map(o=>`<tr><td>${esc(o.seller)}</td><td>${kwh(o.remaining_wh)}</td><td>${inr(o.price_paise)}</td></tr>`),'No open offers. Publish one in the marketplace.')}</div></div>
 <div class="card"><h3>Marketplace activity</h3>${tbl(['Time','Event','Entity'],d.activity.map(a=>`<tr><td>${a.ts.slice(11,19)}</td><td>${a.type}</td><td>${a.entity}</td></tr>`),'No activity.')}</div>`},
async market(){const os=await api('/offers'),c=cur(),f=window.F||(window.F={q:'',max:'',min:'',ver:false,sort:'price'});
 let l=os.filter(o=>o.status=='open'&&o.seller.toLowerCase().includes(f.q.toLowerCase())&&(!f.max||o.price_paise<=f.max*100)&&(!f.min||o.remaining_wh>=f.min*1000)&&(!f.ver||o.verification=='verified'));
 l.sort((a,b)=>f.sort=='price'?a.price_paise-b.price_paise:b.remaining_wh-a.remaining_wh);
 const seller=S.role=='seller'?`<div class="card" style="margin-bottom:16px"><h3>Publish an offer — ${esc(c.name)}</h3><div class="note">Available uncommitted surplus: <b>${kwh(c.available_wh)} kWh</b> (surplus ${kwh(c.surplus_wh)} − listed ${kwh(c.listed_wh)} − sold ${kwh(c.sold_wh)})</div><div class="row"><label>Quantity (kWh)<input id="oq" type="number" step="0.001" min="0" value="5"></label><label>Price (₹/kWh)<input id="op" type="number" step="0.01" min="0" value="4.50"></label><label>Slot<select id="os"><option>Simulated day, 06:00-10:00</option><option selected>Simulated day, 10:00-16:00</option><option>Simulated day, 16:00-20:00</option></select></label><span id="est" style="padding:8px 0">Est. value: ₹22.50</span><button class="p" onclick="publish()">Publish offer</button></div></div>`:`<div class="note">Role is <b>${S.role}</b>. Switch to <b>seller</b> to publish offers${S.role=='buyer'?'':'; to buy, switch to buyer'}.</div>`;
 return NOTE+seller+`<div class="row"><label>Search producer<input id="fq" value="${esc(f.q)}" oninput="F.q=this.value;rf()"></label><label>Max ₹/kWh<input id="fm" type="number" value="${f.max}" style="width:90px" oninput="F.max=this.value;rf()"></label><label>Min kWh<input id="fn" type="number" value="${f.min}" style="width:90px" oninput="F.min=this.value;rf()"></label><label>Sort<select onchange="F.sort=this.value;rf()"><option value="price" ${f.sort=='price'?'selected':''}>Price (low first)</option><option value="qty" ${f.sort=='qty'?'selected':''}>Quantity (high first)</option></select></label><label><span>Verified only</span><input type="checkbox" ${f.ver?'checked':''} onchange="F.ver=this.checked;rf()"></label></div>
 <div class="card"><h3>Available offers (${l.length})</h3>${tbl(['Offer','Producer','Slot','Left kWh','₹/kWh','Verification',''],l.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.seller)}</td><td>${esc(o.slot)}</td><td>${kwh(o.remaining_wh)} / ${kwh(o.qty_wh)}</td><td>${inr(o.price_paise)}</td><td>${badge(o.verification)}</td><td>${S.role=='buyer'?`<button class="p" onclick="buyDlg(${o.id})">Buy</button>`:S.role=='seller'&&o.seller_id==S.hid?`<button class="d" onclick="cancelOffer(${o.id})">Cancel</button>`:''}</td></tr>`),'No offers match. Try clearing filters or publish an offer as a seller.')}</div>`},
async energy(){const c=cur(),os=(await api('/offers')).filter(o=>o.seller_id==c.id),ts=(await api('/trades')).filter(t=>t.buyer_id==c.id||t.seller_id==c.id);
 return NOTE+`<div class="note"><b>Accounting period:</b> one simulated day. Values are energy (kWh), not power (kW). surplus = max(0, generation − consumption). Energy listed or sold is committed and cannot be listed again.</div><h3>${esc(c.name)} (${esc(c.city)})</h3><div class="grid">${M('Generated',kwh(c.generation_wh)+' kWh')}${M('Consumed',kwh(c.consumption_wh)+' kWh')}${M('Surplus',kwh(c.surplus_wh)+' kWh')}${M('Listed for sale',kwh(c.listed_wh)+' kWh')}${M('Sold',kwh(c.sold_wh)+' kWh')}${M('Purchased',kwh(c.purchased_wh)+' kWh')}${M('Available to list',kwh(c.available_wh)+' kWh')}${M('Remaining eligible demand',kwh(c.demand_left_wh)+' kWh','max(0, cons − gen) − purchased')}</div>
 <div class="card" style="margin-bottom:16px"><h3>Adjust synthetic energy</h3><div class="row"><label>Generation (kWh)<input id="eg" type="number" step="0.1" min="0" value="${c.generation_wh/1000}"></label><label>Consumption (kWh)<input id="ec" type="number" step="0.1" min="0" value="${c.consumption_wh/1000}"></label><button class="p" onclick="setEnergy()">Update</button></div><small>Changing generation resets that household’s verification to pending.</small></div>
 <div class="two"><div class="card"><h3>My offers</h3>${tbl(['#','Left','Price','Status'],os.map(o=>`<tr><td>${o.id}</td><td>${kwh(o.remaining_wh)}</td><td>${inr(o.price_paise)}</td><td>${badge(o.status)}</td></tr>`),'No offers.')}</div><div class="card"><h3>Recent energy activity</h3>${tbl(['ID','Role','kWh','Status'],ts.map(t=>`<tr><td>${t.tid}</td><td>${t.seller_id==c.id?'sold':'bought'}</td><td>${kwh(t.qty_wh)}</td><td>${badge(t.status)}</td></tr>`),'No trades yet.')}</div></div>`},
async transactions(){const ts=await api('/trades'),f=window.T||(window.T={q:'',st:'',sort:'new'});window.TS=ts;
 let l=ts.filter(t=>t.tid.toLowerCase().includes(f.q.toLowerCase())&&(!f.st||t.status==f.st));l.sort((a,b)=>f.sort=='new'?b.id-a.id:f.sort=='old'?a.id-b.id:b.amount_paise-a.amount_paise);window.TL=l;
 return NOTE+`<div class="row"><label>Search ID<input value="${esc(f.q)}" oninput="T.q=this.value;rt()"></label><label>Status<select onchange="T.st=this.value;rt()"><option value="">All</option><option ${f.st=='completed'?'selected':''}>completed</option><option ${f.st=='cancelled'?'selected':''}>cancelled</option></select></label><label>Sort<select onchange="T.sort=this.value;rt()"><option value="new">Newest</option><option value="old" ${f.sort=='old'?'selected':''}>Oldest</option><option value="val" ${f.sort=='val'?'selected':''}>Value (high)</option></select></label><button onclick="csv()">Export CSV</button></div>
 <div class="card">${tbl(['ID','Buyer','Seller','kWh','₹/kWh','Total','Status','Date',''],l.map(t=>`<tr><td>${t.tid}</td><td>${esc(t.buyer)}</td><td>${esc(t.seller)}</td><td>${kwh(t.qty_wh)}</td><td>${inr(t.price_paise)}</td><td>${inr(t.amount_paise)}</td><td>${badge(t.status)}</td><td>${t.created.slice(0,16).replace('T',' ')}</td><td><button onclick="detail(${t.id})">Details</button></td></tr>`),'No transactions yet. Buy from an offer in the marketplace.')}</div>
 <div class="card" style="margin-top:16px"><h3>Audit events (append-only application log)</h3>${tbl(['#','Time','Type','Entity'],(await api('/audit-events')).slice(0,15).map(a=>`<tr><td>${a.id}</td><td>${a.ts.slice(0,19).replace('T',' ')}</td><td>${a.type}</td><td>${a.entity}</td></tr>`),'None')}<small>Not claimed tamper-proof. Corrections are new events, never overwrites.</small></div>`},
async verify(){const [rs,a]=await Promise.all([api('/generation-records'),api('/analytics')]);
 return NOTE+`<div class="note">Application-level verification is a demo review step. A simulated meter reference is not proof that a real meter was read, and this is <b>not</b> an official REC or government certificate.${S.role!='reviewer'?' Switch role to <b>reviewer</b> to review records.':''}</div>
 <div class="card" style="margin-bottom:16px"><h3>Generation records</h3>${tbl(['ID','Producer','Period','kWh','Meter ref (synthetic)','Status','Certificate','Trades',''],rs.map(r=>`<tr><td>GEN-${r.id}</td><td>${esc(r.household)}</td><td>${esc(r.period)}</td><td>${kwh(r.qty_wh)}</td><td>${r.meter_ref}</td><td>${badge(r.status)}</td><td>${r.cert_ref||'—'}</td><td>${r.trades.join(', ')||'—'}</td><td>${S.role=='reviewer'?`<input id="c${r.id}" placeholder="cert ref" style="width:130px" value="${r.id==2?'REC-SIM-HYD-001':''}"> <button class="p" onclick="ver(${r.id})">Approve</button> <button class="d" onclick="rej(${r.id})">Reject</button>`:''}</td></tr>`),'No records')}<small>Demo tip: approve GEN-2 using GEN-1’s certificate REC-SIM-HYD-001 to see duplicate rejection.</small></div>
 <h3>Impact analytics</h3><div class="grid">${M('Energy matched',kwh(a.traded_wh)+' kWh','completed trades')}${M('Match rate',pct(a.match_rate),'denominator: eligible buyer demand '+kwh(a.eligible_demand_wh)+' kWh')}${M('Verified generation',kwh(a.verified_wh)+' kWh')}${M('Completed volume',inr(a.volume_paise))}${M('Buyer savings (est.)',inr(a.buyer_savings_paise),'baseline: grid tariff ₹'+a.baselines.grid_tariff_inr+'/kWh (assumption)')}${M('Seller gross revenue',inr(a.seller_earnings_paise))}${M('Seller net gain (est.)',inr(a.seller_net_gain_paise),'vs export baseline ₹'+a.baselines.export_baseline_inr+'/kWh (assumption)')}${M('Avg transaction',inr(a.avg_trade_paise))}${M('Duplicate certs rejected',a.duplicates_rejected)}${M('Settlement error rate',pct(a.settlement_error_rate),'recomputed amount ≠ stored')}${M('Simulated grid import',a.sim_import_kwh==null?'not yet measured':a.sim_import_kwh+' kWh','from last simulator run')}${M('Simulated grid export',a.sim_export_kwh==null?'not yet measured':a.sim_export_kwh+' kWh')}</div><small>No carbon estimate is shown: it would require an emissions factor assumption that is not configured. Date filtering is not implemented.</small>`},
async sim(){const v=window.SV||(window.SV={households:20,producer_share_pct:40,generation_kwh:8,demand_kwh:5,capacity_kwh:30,price_inr:5,battery_kwh:0,battery_soc_kwh:0,battery_rate_kwh:5});
 const f=(k,l)=>`<label>${l}<input type="number" step="0.1" min="0" id="s_${k}" value="${v[k]}"></label>`;
 return NOTE+`<div class="note"><b>Conceptual single-time-step model, not a power-flow model.</b> Producers (share of households) generate; everyone consumes. matched = min(seller surplus, buyer demand, trading capacity). Leftover surplus charges the battery (limited by free capacity and rate), unmet demand discharges it; remainder is simulated grid export/import. Voltage, losses, phase balance and protection are not modelled.</div>
 <div class="card"><div class="row">${f('households','Households')}${f('producer_share_pct','Producers %')}${f('generation_kwh','Gen/producer kWh')}${f('demand_kwh','Demand/household kWh')}${f('capacity_kwh','Trading capacity kWh')}${f('price_inr','Price ₹/kWh')}${f('battery_kwh','Battery kWh')}${f('battery_soc_kwh','Battery SoC kWh')}${f('battery_rate_kwh','Battery rate kWh/step')}<button class="p" onclick="runSim()">Run simulation</button></div><div id="simout" class="empty">Run the simulation to see results.</div></div>`}
,async settings(){return NOTE+`<div class="grid">${M('Role',S.role,'demo-only role switching, not authentication')}${M('Household',esc(cur().name))}${M('Currency','INR (₹)','fixed for India')}${M('Units','kWh (energy)','kW = power, not used for accounting')}</div>
 <div class="card"><h3>Simulation settings</h3><p>Grid tariff baseline ₹8.00/kWh · Export baseline ₹2.50/kWh · Price cap ₹10.00/kWh · Fees ₹0 · Rounding: half-up to the paisa (Decimal arithmetic server-side).</p></div>
 <div class="card" style="margin-top:16px"><h3>Reset demo data</h3><p>Restores the deterministic seed state and clears trades, offers and audit events.</p><button class="d" onclick="resetDemo()">Reset demo to initial state</button></div>`}};
const TITLES={overview:'Overview',market:'Energy Marketplace',energy:'My Energy',transactions:'Transactions',verify:'Verification & Impact',sim:'Microgrid Simulator',settings:'Settings'};
async function render(){const p=(location.hash.slice(2)||'overview');const k=P[p]?p:'overview';$('title').textContent=TITLES[k];
 document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.hash=='#/'+k));nav.classList.remove('open');
 try{HH=await api('/households');$('hid').innerHTML=HH.map(h=>`<option value="${h.id}" ${h.id==S.hid?'selected':''}>${esc(h.name)}</option>`).join('');$('role').value=S.role;
  const ae=await api('/audit-events');$('cnt').textContent=ae.length;$('page').innerHTML=await P[k]()}catch(e){$('page').innerHTML=`<div class="note" style="background:#fee2e2">Could not load: ${esc(e.message)}. Is the backend running?</div>`}}
const rf=()=>{clearTimeout(window.rt_);window.rt_=setTimeout(async()=>{const a=document.activeElement.id;await render();if(a)$(a)?.focus()},200)},rt=rf;
document.addEventListener('input',e=>{if(['oq','op'].includes(e.target.id))$('est').textContent='Est. value: ₹'+(Math.round(+$('oq').value*+$('op').value*100)/100).toFixed(2)});
function publish(){act(()=>api('/offers',{m:'POST',b:{seller_id:S.hid,quantity_kwh:+$('oq').value,price_inr_per_kwh:+$('op').value,slot:$('os').value}}),'Offer published')}
function cancelOffer(i){act(()=>api('/offers/'+i,{m:'PATCH',b:{cancel:true}}),'Offer cancelled')}
function setEnergy(){act(()=>api(`/households/${S.hid}/energy`,{m:'PATCH',b:{generation_kwh:+$('eg').value,consumption_kwh:+$('ec').value}}),'Energy updated')}
async function buyDlg(id){const o=(await api('/offers')).find(x=>x.id==id),c=cur();const d=$('dlg');
 d.innerHTML=`<h3>Confirm simulated purchase</h3><p>${esc(o.seller)} · ${kwh(o.remaining_wh)} kWh left at ${inr(o.price_paise)}/kWh<br>Buyer: ${esc(c.name)} (eligible demand ${kwh(c.demand_left_wh)} kWh)</p><label>Quantity (kWh)<input id="bq" type="number" step="0.001" min="0" value="3"></label><p>Total: <b id="bt">—</b> <small>(no fees configured)</small></p><div class="row"><button onclick="dlg.close()">Back</button><button class="p" id="bc">Confirm purchase</button></div>`;
 const up=()=>$('bt').textContent='₹'+(Math.round(+$('bq').value*o.price_paise*10)/1000>=0?(Math.round(+$('bq').value*o.price_paise)/100).toFixed(2):'—');up();$('bq').oninput=up;
 $('bc').onclick=async()=>{const r=await act(()=>api(`/offers/${id}/purchase`,{m:'POST',b:{buyer_id:S.hid,quantity_kwh:+$('bq').value}}),'Purchase completed');if(r){d.close();toast(`${r.trade.tid}: ${kwh(r.trade.qty_wh)} kWh for ${inr(r.trade.amount_paise)}; ${kwh(r.offer.remaining_wh)} kWh left`)}};d.showModal()}
async function detail(id){const t=await api('/trades/'+id);$('dlg').innerHTML=`<h3>${t.tid} ${badge(t.status)}</h3><table>${Object.entries({Buyer:t.buyer,Seller:t.seller,Offer:'#'+t.offer_id,Quantity:kwh(t.qty_wh)+' kWh',Price:inr(t.price_paise)+'/kWh',Total:inr(t.amount_paise),'Generation record':'GEN-'+t.gen_record_id,Verification:t.verification,'Settlement ref (simulated)':t.settlement_ref,Created:t.created}).map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</table><div class="row" style="margin-top:12px"><button onclick="dlg.close()">Close</button>${t.status=='completed'?`<button class="d" onclick="dlg.close();act(()=>api('/trades/${t.id}/cancel',{m:'POST'}),'Trade cancelled (recorded, quantity restored)')">Cancel trade</button>`:''}</div>`;$('dlg').showModal()}
function csv(){const h=['id','buyer','seller','kwh','price_inr_per_kwh','total_inr','status','created','gen_record','verification','settlement_ref'];
 const r=TL.map(t=>[t.tid,t.buyer,t.seller,t.qty_wh/1000,t.price_paise/100,(t.amount_paise/100).toFixed(2),t.status,t.created,'GEN-'+t.gen_record_id,t.verification,t.settlement_ref].map(x=>`"${x}"`).join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[h.join(','),...r].join('\n')],{type:'text/csv'}));a.download='gridnova_transactions.csv';a.click()}
function ver(id){act(()=>api(`/generation-records/${id}/verify`,{m:'POST',b:{cert_ref:$('c'+id).value}}),'Record verified (application-level)',true)}
function rej(id){act(()=>api(`/generation-records/${id}/reject`,{m:'POST'}),'Record rejected')}
async function runSim(){const b={};for(const k in SV){b[k]=+$('s_'+k).value;SV[k]=b[k]}b.households=Math.round(b.households);
 try{const r=await api('/simulations/run',{m:'POST',b});$('simout').className='';$('simout').innerHTML=`<div class="grid">${M('Aggregate generation',r.generation_kwh+' kWh',r.sellers+' producers')}${M('Aggregate demand',r.demand_kwh+' kWh')}${M('Eligible surplus',r.surplus_kwh+' kWh')}${M('Eligible buyer demand',r.buyer_demand_kwh+' kWh')}${M('Matched energy',r.matched_kwh+' kWh','value ₹'+r.trade_value_inr)}${M('Unmatched (capacity)',r.unmatched_due_to_capacity_kwh+' kWh')}${M('Unmet demand',r.unmet_demand_kwh+' kWh')}${M('Grid import',r.grid_import_kwh+' kWh','simulated')}${M('Grid export',r.grid_export_kwh+' kWh','simulated')}${M('Battery charge / discharge',r.battery_charge_kwh+' / '+r.battery_discharge_kwh+' kWh','end SoC '+r.battery_soc_end_kwh)}</div><small>${r.model}</small>`}catch(e){toast(e.message,1)}}
async function resetDemo(){if(!confirm('Reset all demo data?'))return;await act(()=>api('/reset',{m:'POST'}),'Demo reset to seeded state')}
addEventListener('hashchange',render);render();
</script></body></html>
